<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guild Glory</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f19;
      color: white;
    }

    header {
      background: #111827;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #263247;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      color: #9ca3af;
      margin-top: 6px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #151c2c;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #263247;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2638;
      padding: 14px;
      border-radius: 10px;
      margin: 8px 0;
    }

    .rank {
      font-weight: bold;
      margin-right: 10px;
    }

    .glory {
      font-weight: bold;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏆 Guild Glory</h1>
    <p>Free Fire Guild Leaderboard</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🏆 Leaderboard</h2>

      <div class="member">
        <div>
          <span class="rank">#1</span>
          <strong>Player 1</strong>
        </div>
        <span class="glory">1000 ⭐</span>
      </div>

      <div class="member">
        <div>
          <span class="rank">#2</span>
          <strong>Player 2</strong>
        </div>
        <span class="glory">750 ⭐</span>
      </div>

      <div class="member">
        <div>
          <span class="rank">#3</span>
          <strong>Player 3</strong>
        </div>
        <span class="glory">500 ⭐</span>
      </div>

      <div class="empty">
        More guild members will appear here.
      </div>

    </div>

    <div class="card">
      <h2>⭐ Guild Glory System</h2>
      <p>
        Members earn Glory points and compete for the top positions
        on the guild leaderboard.
      </p>
    </div>

  </div>

  <footer>
    Guild Glory • Free Fire Guild Website
  </footer>

</body>
</html>
